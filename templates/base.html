<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}nursesedge {% endblock %}</title>
    <link rel="icon" href="https://res.cloudinary.com/dmqizfpyz/image/upload/v1775390368/Screenshot_2026-04-05_115733_ataewa.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/namari-color.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    {% block head_extra %}{% endblock %}
    <style>
        html, body {
            margin: 0 !important;
            padding: 0 !important;
        }
        #wrapper {
            padding-top: 0 !important;
            margin-top: 0 !important;
        }
        #header {
            top: 0 !important;
            margin-top: 0 !important;
        }
        .base-page-content {
            padding-top: 82px;
        }
        #logo {
            display: flex !important;
            align-items: center !important;
            height: 71px !important;
        }
        #logo a {
            display: flex !important;
            align-items: center !important;
            gap: 6px !important;
            text-decoration: none !important;
        }
        #logo img {
            max-height: 42px !important;
            height: 42px !important;
            width: auto !important;
        }
        #logo a span {
            display: inline-block !important;
            font-size: 20px !important;
            font-weight: 800 !important;
            color: #111111 !important;
            white-space: nowrap !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        @media only screen and (max-width: 767px) {
            #logo img {
                max-height: 32px !important;
                height: 32px !important;
            }
            #logo a span {
                font-size: 16px !important;
            }
            #logo {
                height: 50px !important;
            }
        }
        @media only screen and (max-width: 767px) {
            #nav-mobile a[href="/login/"],
            #nav-mobile a[href="/signup/"] {
                text-align: center !important;
                font-weight: 700 !important;
                border-radius: 9px !important;
                margin: 10px 0 !important;
                padding: 11px 14px !important;
                border: 1px solid transparent !important;
                background-image: none !important;
            }
            #nav-mobile a[href="/login/"] {
                background: #ffffff !important;
                color: #111111 !important;
                border-color: #d4d4d8 !important;
            }
            #nav-mobile a[href="/signup/"] {
                background: #111111 !important;
                color: #ffffff !important;
                border-color: #111111 !important;
            }
            #nav-mobile a[href="/login/"]:hover,
            #nav-mobile a[href="/signup/"]:hover {
                opacity: 0.92;
            }
        }
    </style>
</head>
<body>
<div id="wrapper">
    <div id="header" class="nav-collapse nav-solid" style="position: static;">
        <div class="row clearfix">
            <div class="col-1">
                <div id="logo">
                    <a href="/">
                        <img src="https://res.cloudinary.com/dmqizfpyz/image/upload/v1775390368/Screenshot_2026-04-05_115733_ataewa.png" alt="nursesedge  Logo">
                        <span>nursesedge </span>
                    </a>
                </div>
                <aside>
                    <nav id="nav-main">
                        <ul>
                            <li><a href="/">Home</a></li>
                            <li><a href="/about/">About</a></li>
                            <li><a href="/nclex/">NCLEX</a></li>
                            <li><a href="/contact/">Contact</a></li>
                            <li><a href="/login/">Login</a></li>
                            <li><a href="/signup/">Signup</a></li>
                        </ul>
                    </nav>
                </aside>
                <div id="nav-trigger"><span></span></div>
                <nav id="nav-mobile"></nav>
            </div>
        </div>
    </div>

    <div class="base-page-content">
        {% block content %}{% endblock %}
    </div>

    <footer id="landing-footer" class="clearfix">
        <div class="row clearfix">
            <p id="copyright" class="col-2">
                &copy; <span id="footer-year"></span> All rights reserved nursesedge .
            </p>
        </div>
    </footer>
</div>

<script src="/js/jquery.1.8.3.min.js"></script>
<script src="/js/wow.min.js"></script>
<script src="/js/jquery.scrollUp.min.js"></script>
<script src="/js/jquery.easing.min.js"></script>
<script src="/js/jquery.stickyNavbar.min.js"></script>
<script src="/js/jquery.waypoints.min.js"></script>
<script src="/js/site.js"></script>
<style>
    .app-msg-modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 16px;
    }
    .app-msg-modal {
        width: min(460px, 96vw);
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
    }
    .app-msg-modal-head {
        padding: 14px 16px;
        border-bottom: 1px solid #eceff4;
        font-weight: 700;
    }
    .app-msg-modal-body {
        padding: 16px;
        color: #334155;
        line-height: 1.5;
    }
    .app-msg-modal-foot {
        padding: 12px 16px;
        border-top: 1px solid #eceff4;
        display: flex;
        justify-content: flex-end;
    }
    .app-msg-modal-btn {
        border: none;
        background: #1a1a2e;
        color: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
    }
</style>
<div id="appMessageModalBase" class="app-msg-modal-backdrop" aria-hidden="true">
    <div class="app-msg-modal" role="dialog" aria-modal="true" aria-labelledby="appMsgBaseTitle">
        <div class="app-msg-modal-head" id="appMsgBaseTitle">Notice</div>
        <div class="app-msg-modal-body" id="appMsgBaseBody">Something needs your attention.</div>
        <div class="app-msg-modal-foot">
            <button type="button" class="app-msg-modal-btn" id="appMsgBaseCloseBtn">OK</button>
        </div>
    </div>
</div>
<script>
    (function () {
        var yearEl = document.getElementById("footer-year");
        if (yearEl) yearEl.textContent = new Date().getFullYear();

        var modal = document.getElementById("appMessageModalBase");
        var titleEl = document.getElementById("appMsgBaseTitle");
        var bodyEl = document.getElementById("appMsgBaseBody");
        var closeBtn = document.getElementById("appMsgBaseCloseBtn");
        if (!modal || !titleEl || !bodyEl || !closeBtn) return;

        function closeModal() {
            modal.style.display = "none";
            modal.setAttribute("aria-hidden", "true");
        }
        function openModal(message, title) {
            titleEl.textContent = title || "Notice";
            bodyEl.textContent = message || "Something needs your attention.";
            modal.style.display = "flex";
            modal.setAttribute("aria-hidden", "false");
            closeBtn.focus();
        }
        closeBtn.addEventListener("click", closeModal);
        modal.addEventListener("click", function (e) {
            if (e.target === modal) closeModal();
        });
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && modal.style.display === "flex") closeModal();
        });

        window.showAppMessageModal = openModal;
    })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
